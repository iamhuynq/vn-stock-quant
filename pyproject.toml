[project]
name = "fireant-crawler"
version = "0.1.0"
description = "Rate-limited, GET-only crawler for FireAnt market data (research use)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.27",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pytz>=2026.5",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
fireant = "fireant_crawler.cli:main"
quant = "quant_research.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]
ui = [
    "plotly>=7.1.0",
    "streamlit>=1.65.0",
]

[tool.uv]
default-groups = ["dev", "ui"]

[tool.uv.build-backend]
module-name = ["fireant_crawler", "quant_research", "stock_ui"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
